# Qwen3-32B TP4 configuration for the LongBench V2 KVfold accuracy experiment.
# Change only model/device/log paths for the target machine. Use this exact same
# file for the baseline and every registered KVfold codec service launch.

export ASCEND_RT_VISIBLE_DEVICES=0,1,2,3
export VLLM_WORKER_MULTIPROC_METHOD=spawn
export VLLM_LOGGING_LEVEL=INFO
export PYTHONHASHSEED=0
export ENABLE_UCM_PATCH=0

model=/mnt/models/Qwen3-32B
served_model_name=Qwen3-32B
server_host=0.0.0.0
server_port=8000

tp_size=4
dp_size=1
pp_size=1
node_num=1
seed=2026
enable_expert_parallel=false
distributed_executor_backend=mp

max_model_len=131072
max_num_batched_tokens=2048
max_num_seqs=1
block_size=128
gpu_memory_utilization=0.87
quantization=NONE

enable_prefix_caching=false
async_scheduling=false
graph_mode=
enforce_eager=true

enable_speculative_decoding=false
speculative_decode_model=NONE
speculative_decode_method=deepseek_mtp
num_speculative_tokens=1

enable_rope_scaling=true
rope_theta=1000000
rope_type=yarn
factor=4.0
original_max_position_embeddings=32768

enable_ascend_scheduler=false
enable_torchair_graph=false

# This experiment hooks Attention directly; do not enable the UCM Store path.
ucm_enable=false
ucm_config_yaml_path=

vllm_log_path=./logs
